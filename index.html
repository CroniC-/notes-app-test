<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Notes</h1>
        <button id="new-note" class="btn btn-primary">+ New</button>
      </div>
      <input type="search" id="search" placeholder="Search notes\u2026" autocomplete="off">
      <select id="folder-filter" aria-label="Filter by folder">
        <option value="">All folders</option>
      </select>
      <div id="tag-cloud" class="tag-cloud" role="group" aria-label="Tags"></div>
      <ul id="note-list" class="note-list" role="listbox" aria-label="Notes"></ul>
      <div class="sidebar-footer">
        <button id="export" class="btn btn-ghost">Export</button>
        <button id="import" class="btn btn-ghost">Import</button>
        <button id="theme-toggle" class="btn btn-ghost" title="Toggle theme">Toggle theme</button>
      </div>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </aside>

    <main class="main">
      <div id="empty-state" class="empty-state">
        <p class="empty-title">No note selected</p>
        <p>Create a new note to get started.</p>
      </div>

      <div id="editor-pane" class="editor-pane" hidden>
        <div class="note-meta">
          <input id="note-title" type="text" placeholder="Untitled" autocomplete="off">
          <div class="meta-row">
            <label>Folder
              <input id="note-folder" type="text" placeholder="none" autocomplete="off">
            </label>
            <label>Tags
              <input id="note-tags" type="text" placeholder="comma, separated" autocomplete="off">
            </label>
          </div>
        </div>

        <div class="toolbar">
          <div class="view-toggle" role="group" aria-label="View mode">
            <button id="view-write" class="btn active" aria-pressed="true">Write</button>
            <button id="view-preview" class="btn" aria-pressed="false">Preview</button>
          </div>
          <div class="toolbar-right">
            <span id="save-indicator" class="save-indicator" aria-live="polite" aria-atomic="true"></span>
            <button id="delete-note" class="btn btn-danger">Delete</button>
          </div>
        </div>

        <div class="format-toolbar" role="group" aria-label="Formatting">
          <button id="fmt-bold" class="fmt-btn" title="Bold (Ctrl+B)" aria-label="Bold">B</button>
          <button id="fmt-italic" class="fmt-btn" title="Italic (Ctrl+I)" aria-label="Italic">I</button>
          <button id="fmt-strike" class="fmt-btn" title="Strikethrough" aria-label="Strikethrough">S</button>
          <select id="fmt-heading" class="fmt-btn fmt-select" title="Heading" aria-label="Heading">
            <option value="">Text</option>
            <option value="h1">Heading 1</option>
            <option value="h2">Heading 2</option>
            <option value="h3">Heading 3</option>
            <option value="h4">Heading 4</option>
          </select>
          <button id="fmt-ul" class="fmt-btn" title="Bullet List" aria-label="Bullet List">UL</button>
          <button id="fmt-ol" class="fmt-btn" title="Numbered List" aria-label="Numbered List">OL</button>
          <button id="fmt-link" class="fmt-btn" title="Link (Ctrl+K)" aria-label="Link">Link</button>
          <button id="fmt-code" class="fmt-btn" title="Code Block" aria-label="Code Block">Code</button>
          <button id="fmt-quote" class="fmt-btn" title="Blockquote" aria-label="Blockquote">Quote</button>
          <button id="fmt-hr" class="fmt-btn" title="Horizontal Rule" aria-label="Horizontal Rule">HR</button>
        </div>

        <textarea id="note-body" placeholder="Write in Markdown\u2026" spellcheck="true"></textarea>
        <div id="preview" class="preview markdown" hidden></div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
